<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004f87" />
    <meta
      name="description"
      content="مشرق — منصّة تعليمية ذكية تشرح المناهج وتلخّصها وتختبر بعد كل درس وتبني خطة تفوّق لكل طالب."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مشرق | Mushriq" />
    <meta property="og:title" content="مشرق — مدرستك الذكية بالذكاء الاصطناعي" />
    <meta
      property="og:description"
      content="شرح تفاعلي وتلخيص ذكي واختبار بعد كل درس، ثم تشخيص للفجوات وخطة تفوّق لكل طالب — مدرسة رقمية عربية تعمل ٢٤/٧."
    />
    <meta property="og:locale" content="ar_SA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var root = document.documentElement;
        root.className += " js";
        try {
          var en = (localStorage.getItem("mushriq-lang") || localStorage.getItem("taqat-lang")) === "en";
          root.lang = en ? "en" : "ar";
          root.dir = en ? "ltr" : "rtl";
          if (en) {
            root.className += " i18n-pending";
            setTimeout(function () {
              root.classList.remove("i18n-pending");
            }, 3000);
          }
        } catch (e) {}
      })();
    </script>
    <title>مشرق | Mushriq</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
